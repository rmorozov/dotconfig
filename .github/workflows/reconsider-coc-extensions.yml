name: Reconsider quarantined CoC extensions

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: reconsider-coc-extensions
  cancel-in-progress: true

jobs:
  reconsider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Read committed Node version
        id: node_pin
        run: echo "version=$(bash scripts/node-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node_pin.outputs.version }}

      - name: Audit quarantined extensions
        run: bash scripts/reconsider-coc-extensions.sh

      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open-refresh-pr.sh \
            "automation/reconsider-coc-extensions" \
            "Restore remediated CoC extensions" \
            "Nightly audit found that one or more quarantined CoC extensions no longer resolve to high-severity npm advisories. This PR restores exact current versions for normal review and platform validation." \
            "versions/coc-extensions" \
            "versions/coc-extensions-disabled" \
            "home/dot_vim/coc-extensions.vim"
