name: Reconsider quarantined CoC extensions

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconsider-coc-extensions
  cancel-in-progress: true

jobs:
  reconsider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Audit quarantined extensions
        run: bash scripts/reconsider-coc-extensions.sh

      - name: Open or update restoration pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          paths=(
            versions/coc-extensions
            versions/coc-extensions-disabled
            home/dot_vim/coc-extensions.vim
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "No quarantined CoC extension is ready to restore."
            exit 0
          fi

          refresh_branch="automation/reconsider-coc-extensions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$refresh_branch"
          git add "${paths[@]}"
          git commit -m "Restore remediated CoC extensions"
          git push --force-with-lease origin "HEAD:$refresh_branch"

          body="Nightly audit found that one or more quarantined CoC extensions no longer resolve to high-severity npm advisories. This PR restores exact current versions for normal review and platform validation."
          if gh pr view "$refresh_branch" >/dev/null 2>&1; then
            gh pr edit "$refresh_branch" \
              --title "Restore remediated CoC extensions" \
              --body "$body"
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$refresh_branch" \
              --title "Restore remediated CoC extensions" \
              --body "$body"
          fi
