name: Refresh runtime versions

on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-runtime-versions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        run: |
          bash scripts/install-bootstrap-tool.sh mise
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh pinned versions
        run: bash scripts/update-runtime-versions.sh

      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open-refresh-pr.sh \
            "automation/refresh-runtime-versions" \
            "Refresh runtime versions" \
            "Automated nightly refresh of the pinned Node.js LTS, Go, and Python 3.14 patch releases." \
            "home/dot_config/mise/config.toml"
