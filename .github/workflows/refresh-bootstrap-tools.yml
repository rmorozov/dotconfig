name: Refresh bootstrap tools

on:
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-bootstrap-tools
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Refresh pinned bootstrap sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-bootstrap-tools.sh

      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open-refresh-pr.sh \
            "automation/refresh-bootstrap-tools" \
            "Refresh bootstrap tool pins" \
            "Automated nightly refresh of exact chezmoi and mise releases, immutable installer revisions, and reviewed mise archive SHA-256 values." \
            "versions/bootstrap-tools"
