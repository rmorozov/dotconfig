name: Refresh Vim plugins

on:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-vim-plugins
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - run: bash scripts/update-vim-plugins.sh
      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open-refresh-pr.sh \
            "automation/refresh-vim-plugins" \
            "Refresh Vim plugin revisions" \
            "Automated nightly refresh of exact Vim plugin commits." \
            "versions/vim-plugins" \
            "home/dot_vim/plugin-lock.vim"
