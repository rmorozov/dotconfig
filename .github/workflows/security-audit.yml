name: Audit dependency advisories

on:
  pull_request:
    paths:
      - versions/coc-extensions
      - scripts/audit-coc-extensions.sh
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-dependency-advisories
  cancel-in-progress: true

jobs:
  coc-extensions:
    name: CoC npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Audit exact CoC extension versions
        run: bash scripts/audit-coc-extensions.sh
