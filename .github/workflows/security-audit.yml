name: Audit dependency advisories

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-dependency-advisories
  cancel-in-progress: true

jobs:
  coc-extensions:
    name: CoC npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Audit exact CoC extension versions
        run: bash scripts/audit-coc-extensions.sh
