name: Audit dependency advisories

on:
  pull_request:
    paths:
      - versions/coc-extensions
      - scripts/audit-coc-extensions.sh
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-dependency-advisories
  cancel-in-progress: true

jobs:
  coc-extensions:
    name: CoC npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Audit exact CoC extension versions
        run: bash scripts/audit-coc-extensions.sh
