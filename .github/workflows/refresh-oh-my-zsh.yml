name: Refresh Oh My Zsh

on:
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-oh-my-zsh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh pinned revision
        run: bash scripts/update-oh-my-zsh.sh

      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- versions/oh-my-zsh; then
            echo "Oh My Zsh is already current."
            exit 0
          fi

          refresh_branch="automation/refresh-oh-my-zsh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$refresh_branch"
          git add versions/oh-my-zsh
          git commit -m "Refresh Oh My Zsh revision"
          git push --force-with-lease origin "HEAD:$refresh_branch"

          if gh pr view "$refresh_branch" >/dev/null 2>&1; then
            gh pr edit "$refresh_branch" \
              --title "Refresh Oh My Zsh revision" \
              --body "Automated monthly refresh of the pinned Oh My Zsh commit."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$refresh_branch" \
              --title "Refresh Oh My Zsh revision" \
              --body "Automated monthly refresh of the pinned Oh My Zsh commit."
          fi
