name: Refresh Oh My Zsh

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-oh-my-zsh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Refresh pinned revision
        run: bash scripts/update-oh-my-zsh.sh

      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open-refresh-pr.sh \
            "automation/refresh-oh-my-zsh" \
            "Refresh Oh My Zsh revision" \
            "Automated nightly refresh of the pinned Oh My Zsh commit." \
            "versions/oh-my-zsh"
