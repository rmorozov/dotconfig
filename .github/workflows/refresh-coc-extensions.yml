name: Refresh CoC extensions
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-coc-extensions
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - run: bash scripts/update-coc-extensions.sh
      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          paths=(versions/coc-extensions home/dot_vim/coc-extensions.vim)
          if git diff --quiet -- "${paths[@]}"; then
            echo "CoC extensions are already current."
            exit 0
          fi
          refresh_branch="automation/refresh-coc-extensions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$refresh_branch"
          git add "${paths[@]}"
          git commit -m "Refresh CoC extension versions"
          git push --force-with-lease origin "HEAD:$refresh_branch"
          if gh pr view "$refresh_branch" >/dev/null 2>&1; then
            gh pr edit "$refresh_branch" --title "Refresh CoC extension versions" --body "Automated nightly refresh of exact CoC npm extension versions."
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$refresh_branch" --title "Refresh CoC extension versions" --body "Automated nightly refresh of exact CoC npm extension versions."
          fi
