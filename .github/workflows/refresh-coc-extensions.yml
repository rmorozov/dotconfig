name: Refresh CoC extensions
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-coc-extensions
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
      - run: bash scripts/update-coc-extensions.sh
      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open-refresh-pr.sh \
            "automation/refresh-coc-extensions" \
            "Refresh CoC extension versions" \
            "Automated nightly refresh of exact CoC npm extension versions." \
            "versions/coc-extensions" \
            "home/dot_vim/coc-extensions.vim"
