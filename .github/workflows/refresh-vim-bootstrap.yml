name: Refresh Vim Bootstrap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-vim-bootstrap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Generate snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          output="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 3 \
            'https://vim-bootstrap.com/generate.vim' \
            --data 'langs=c&langs=python&langs=go&editor=vim&additional-plugins=fzf,vim-easymotion' \
            > "$output"
          test -s "$output"
          grep -q 'vim-bootstrap' "$output"
          sed -i '1c\" vim-bootstrap snapshot; refreshed by .github/workflows/refresh-vim-bootstrap.yml' "$output"
          mv "$output" home/dot_vimrc

      - name: Validate generated snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s home/dot_vimrc
          grep -q 'vim-bootstrap snapshot' home/dot_vimrc
          grep -q "call plug#begin" home/dot_vimrc
          grep -q 'source ~/.vim/plugin-lock.vim' home/dot_vimrc
          grep -q "call plug#end" home/dot_vimrc

      - name: Open or update refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open-refresh-pr.sh \
            "automation/refresh-vim-bootstrap" \
            "Refresh Vim Bootstrap snapshot" \
            "Automated nightly refresh of the committed Vim Bootstrap base. Local Vim and CoC configuration remains unchanged." \
            "home/dot_vimrc"
