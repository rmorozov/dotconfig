name: Validate configuration

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.os }} / ${{ matrix.machine_role }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            machine_role: work
            host_type: laptop
          - os: macos-26
            machine_role: personal
            host_type: laptop
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install Ubuntu validators
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl shellcheck zsh
          curl --fail --silent --show-error --location https://mise.run | sh
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install macOS validators
        if: runner.os == 'macOS'
        run: brew install chezmoi mise shellcheck

      - name: Validate source scripts
        run: |
          shellcheck install.sh packages/install.sh scripts/update-runtime-versions.sh
          bash -n install.sh
          bash -n packages/install.sh
          bash -n scripts/update-runtime-versions.sh
          zsh -n home/dot_config/zsh/common.zsh
          zsh -n home/dot_config/zsh/darwin.zsh
          zsh -n home/dot_config/zsh/linux.zsh

      - name: Validate package check
        shell: bash
        run: |
          set +e
          bash packages/install.sh --check
          status=$?
          set -e
          test "$status" -le 1

      - name: Validate Vim Bootstrap snapshot
        run: |
          test -s home/dot_vimrc
          grep -q 'vim-bootstrap snapshot' home/dot_vimrc
          grep -q "call plug#begin" home/dot_vimrc
          grep -q "call plug#end" home/dot_vimrc

      - name: Render profile and apply chezmoi source state
        shell: bash
        run: |
          test_home="$(mktemp -d)"
          config_file="$test_home/chezmoi.toml"
          cat > "$config_file" <<EOF
          [data]
              machineRole = "${{ matrix.machine_role }}"
              hostType = "${{ matrix.host_type }}"
          EOF
          HOME="$test_home" chezmoi \
            --config "$config_file" \
            --source "$GITHUB_WORKSPACE" \
            apply
          test -f "$test_home/.zshrc"
          test -f "$test_home/.vimrc"
          test -f "$test_home/.vim/coc-settings.json"
          test -x "$test_home/.local/bin/dotconfig"
          test -f "$test_home/.config/mise/config.toml"
          test -f "$test_home/.config/zsh/common.zsh"
          test -f "$test_home/.config/zsh/darwin.zsh"
          test -f "$test_home/.config/zsh/linux.zsh"
          grep -q 'node = "24.21.0"' "$test_home/.config/mise/config.toml"
          grep -q 'go = "1.27.1"' "$test_home/.config/mise/config.toml"
          grep -q 'python = "3.14.7"' "$test_home/.config/mise/config.toml"
          grep -q 'DOTCONFIG_ROLE="${{ matrix.machine_role }}"' "$test_home/.zshrc"
          zsh -n "$test_home/.zshrc"
          shellcheck "$test_home/.local/bin/dotconfig"
          bash -n "$test_home/.local/bin/dotconfig"

      - name: Validate first-run profile defaults
        if: runner.os == 'Linux'
        shell: bash
        run: |
          init_home="$(mktemp -d)"
          HOME="$init_home" chezmoi \
            --source "$GITHUB_WORKSPACE" \
            init --apply --promptDefaults
          grep -q 'DOTCONFIG_ROLE="personal"' "$init_home/.zshrc"
          grep -q 'DOTCONFIG_HOST_TYPE="laptop"' "$init_home/.zshrc"
