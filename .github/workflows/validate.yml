name: Validate configuration

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.os }} / ${{ matrix.machine_role }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            machine_role: work
            host_type: laptop
          - os: macos-26
            machine_role: personal
            host_type: laptop
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install Ubuntu validators
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl shellcheck zsh
          bash scripts/install-bootstrap-tool.sh mise
          bash scripts/install-bootstrap-tool.sh chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install macOS validators
        if: runner.os == 'macOS'
        run: brew install chezmoi mise shellcheck

      - name: Run repository validation
        run: bash scripts/validate.sh

      - name: Validate package check
        shell: bash
        run: |
          set +e
          bash packages/install.sh --check
          status=$?
          set -e
          test "$status" -le 1

      - name: Validate Vim Bootstrap snapshot
        run: |
          test -s home/dot_vimrc
          grep -q 'vim-bootstrap snapshot' home/dot_vimrc
          grep -q "call plug#begin" home/dot_vimrc
          grep -q 'source ~/.vim/plugin-lock.vim' home/dot_vimrc
          grep -q "call plug#end" home/dot_vimrc
          test -s home/dot_vim/plugin-lock.vim
          test -s home/dot_vim/coc-extensions.vim
          extension_count="$(grep -vc '^#' versions/coc-extensions)"
          generated_extension_count="$(grep -c "@[0-9]" home/dot_vim/coc-extensions.vim)"
          test "$extension_count" = "$generated_extension_count"
          awk 'NR > 1 && $2 !~ /^[0-9]+\.[0-9]+\.[0-9]+/ { exit 1 }' versions/coc-extensions
          manifest_count="$(grep -vc '^#' versions/vim-plugins)"
          lock_count="$(grep -c '^call s:DotconfigPin' home/dot_vim/plugin-lock.vim)"
          test "$manifest_count" = "$lock_count"
          awk 'NR > 1 && $4 !~ /^[0-9a-f]{40}$/ { exit 1 }' versions/vim-plugins

      - name: Render profile and apply chezmoi source state
        shell: bash
        run: |
          test_home="$(mktemp -d)"
          config_file="$test_home/chezmoi.toml"
          cat > "$config_file" <<EOF
          [data]
              machineRole = "${{ matrix.machine_role }}"
              hostType = "${{ matrix.host_type }}"
          EOF
          HOME="$test_home" chezmoi \
            --config "$config_file" \
            --source "$GITHUB_WORKSPACE" \
            apply
          test -f "$test_home/.zshrc"
          test -f "$test_home/.vimrc"
          test -f "$test_home/.vim/coc-settings.json"
          test -x "$test_home/.local/bin/dotconfig"
          test -f "$test_home/.config/mise/config.toml"
          test -f "$test_home/.config/zsh/common.zsh"
          test -f "$test_home/.config/zsh/darwin.zsh"
          test -f "$test_home/.config/zsh/linux.zsh"
          cmp home/dot_config/mise/config.toml "$test_home/.config/mise/config.toml"
          grep -q 'DOTCONFIG_ROLE="${{ matrix.machine_role }}"' "$test_home/.zshrc"
          zsh -n "$test_home/.zshrc"
          shellcheck "$test_home/.local/bin/dotconfig"
          bash -n "$test_home/.local/bin/dotconfig"
          "$test_home/.local/bin/dotconfig" --help | grep -q '^  sync '
          grep -Eq '^[0-9a-f]{40}$' versions/oh-my-zsh

          remote_repo="$(mktemp -d)"
          work_repo="$(mktemp -d)"
          git -C "$remote_repo" init --bare
          git -C "$work_repo" init
          git -C "$work_repo" config user.name test
          git -C "$work_repo" config user.email test@example.com
          touch "$work_repo/README"
          git -C "$work_repo" add README
          git -C "$work_repo" commit -m initial
          git -C "$work_repo" remote add origin "$remote_repo"
          git -C "$work_repo" push origin HEAD:master
          test_revision="$(git -C "$work_repo" rev-parse HEAD)"
          printf '%s\n' "$test_revision" > versions/oh-my-zsh
          OH_MY_ZSH_REPOSITORY="$remote_repo" \
          OH_MY_ZSH_HOME="$test_home/.oh-my-zsh" \
            bash scripts/install-oh-my-zsh.sh
          test "$(git -C "$test_home/.oh-my-zsh" rev-parse HEAD)" = "$test_revision"
          HOME="$test_home" EDITOR=true "$test_home/.local/bin/dotconfig" private
          private_file="$test_home/.zshrc.${{ matrix.machine_role }}.local"
          test -f "$private_file"
          test -z "$(find "$private_file" -perm -077 -print)"

      - name: Validate first-run profile defaults
        if: runner.os == 'Linux'
        shell: bash
        run: |
          init_home="$(mktemp -d)"
          HOME="$init_home" chezmoi \
            --source "$GITHUB_WORKSPACE" \
            init --apply --promptDefaults
          grep -q 'DOTCONFIG_ROLE="personal"' "$init_home/.zshrc"
          grep -q 'DOTCONFIG_HOST_TYPE="laptop"' "$init_home/.zshrc"
