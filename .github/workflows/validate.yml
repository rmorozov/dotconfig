name: Validate configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y curl shellcheck zsh
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate scripts
        run: |
          shellcheck install.sh packages/install.sh
          bash -n install.sh
          zsh -n home/dot_zshrc
          bash -n packages/install.sh

      - name: Validate Vim Bootstrap snapshot
        run: |
          test -s home/dot_vimrc
          grep -q 'vim-bootstrap snapshot' home/dot_vimrc
          grep -q "call plug#begin" home/dot_vimrc
          grep -q "call plug#end" home/dot_vimrc

      - name: Render chezmoi source state
        run: |
          chezmoi --source "$GITHUB_WORKSPACE" cat ~/.zshrc >/dev/null
          chezmoi --source "$GITHUB_WORKSPACE" cat ~/.vimrc >/dev/null
